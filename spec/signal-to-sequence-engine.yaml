manual_steps_checklist:
  1_resolve_plan_access:
    what: >
      apollo_mixed_people_api_search and apollo_mixed_companies_search are
      still blocked (see execution_notes.plan_access_status_2026-08-25) even
      after a Custom-plan upgrade and a full connector reconnect.
    action: >
      Contact Apollo support/billing directly — ask specifically whether API
      access needs separate provisioning beyond the plan upgrade itself.
      Nothing further to try from this session; re-run the two blocked
      calls once support confirms it's resolved.
    blocks: [stage_1a, stage_1b (all 3 signals), stage_4's contact pull]

  2_clarify_pre_existing_custom_fields:
    what: >
      apollo_fields_index turned up 5 custom contact fields not created by
      this spec (Messaging Angle, Outreach Urgency, Qualification Status,
      Reasoning, Qualify Contact — see execution_notes).
    action: >
      Confirm whether these are from unrelated prior work. If related,
      decide whether to reuse "Messaging Angle" / "Reasoning" instead of
      creating new fields, or keep them separate to avoid collisions.

  2b_check_the_existing_workflow_and_lists:
    what: >
      The 2026-08-25 endpoint sweep found state that predates this spec:
      an "Apollo Buying Group" list (6 contacts) and, more importantly, 4
      scheduled "Workflow - Review pending approvals" tasks — meaning a
      Workflow already exists in this account. No MCP tool reveals which
      Workflow or what it's approving.
    action: >
      Open the Apollo UI's Workflows tab and check what this existing
      Workflow does before building stage_5 — don't build a duplicate.
      Reuse the "Apollo Buying Group" list (id 6a8b4f9591a3530020b06b87)
      directly for the worked example instead of rebuilding it. Clear the
      4 pending approval-review tasks or leave them — confirm they aren't
      blocking anything before proceeding.

  3_create_the_email_body_custom_field:
    what: >
      generation_and_enrollment_service needs a long-text contact custom
      field to write the generated body into (merged via
      {{custom_email_body_seq_N}}). No MCP tool creates custom fields
      (apollo_fields_create was not in the authoring session's toolset).
    action: >
      Create it in Apollo UI (Settings > Custom Fields > Contact), or via
      the REST API directly (docs.apollo.io/reference/create-a-custom-field)

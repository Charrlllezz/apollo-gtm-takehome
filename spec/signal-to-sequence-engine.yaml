# =============================================================================
# Vitally × Apollo GTM Engineering — Signal-to-Sequence Engine
# Execution spec for a Claude Code session with live Apollo MCP access.
#
# This file is the machine-readable counterpart to the human-facing diagram:
#   https://claude.ai/code/artifact/2ba1ea98-4417-47d1-99e0-4f9d5763b743
#
# HOW TO USE THIS FILE (for the executing Claude Code session):
#   1. Read `execution_notes` first — it lists which steps have a real Apollo
#      MCP tool today vs. which require the Apollo web UI or a raw REST call,
#      as of the tool surface available in the session that authored this spec
#      (2026-08-24). Re-verify tool availability before assuming a gap still
#      exists — Apollo's MCP surface may have grown since.
#   2. Work top to bottom: stage_1a -> stage_2 -> stage_3 -> stage_4 ->
#      generation_and_enrollment_service -> stage_5 -> stage_6 ->
#      metrics_and_optimization_loop. Each stage lists `mcp_tool` (call this
#      directly), `manual_ui`/`manual_ui_fallback` (no MCP tool known — build
#      in-app), or both (partial MCP support, confirm before relying on it).
#   3. `worked_example` at the bottom is the Apollo.io buying committee —
#      use it to sanity-check the engine before pointing it at a real list.
#   4. Do not send anything live without explicit human sign-off — this spec
#      configures targeting/scoring/sequencing logic, not permission to send.
# =============================================================================

